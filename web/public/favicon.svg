  <rect width="32" height="32" rx="7" fill="#111316" />
  <path d="M6 13h20" stroke="#57d4d4" stroke-width="2.5" stroke-linecap="round" />
  <path d="M17 13l5 7" stroke="#ad57d0" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="6" cy="13" r="2.5" fill="#57d4d4" />
  <circle cx="26" cy="13" r="2.5" fill="#157d41" />
  <circle cx="22" cy="20.5" r="2.5" fill="#ad57d0" />
</svg>
