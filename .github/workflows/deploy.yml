name: deploy

# Release on a version tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# 1. build a multi-arch image (amd64 + arm64: Hetzner/DigitalOcean are x86,
#    Oracle's free tier is ARM) and push it to GHCR as :v0.1.0, :<sha>, :latest
# 2. if a server is configured, roll the demo to that exact version
#
# Step 2 is skipped (not failed) until these repository secrets exist:
#   DEPLOY_HOST     the server's address
#   DEPLOY_USER     an SSH user in the docker group
#   DEPLOY_SSH_KEY  a private key for that user (a dedicated deploy key)
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan <host>`, so the first
#                   connection is verified instead of trusted blindly

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # never abandon a rollout halfway

permissions:
  contents: read

jobs:
  release:
    name: build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/ithaca
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3 # runs the arm64 build stages' RUN steps
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/bake-action@v5
        with:
          files: build/docker-bake.hcl
          targets: ithaca-release
          push: true
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ steps.meta.outputs.date }}

      # The image that was just pushed must start and report the version it
      # was tagged with, or the tag is lying.
      - name: smoke test the pushed image
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ithaca:${{ steps.meta.outputs.version }}"
          docker run --rm "$img" version | tee /dev/stderr | grep -q "${{ steps.meta.outputs.version }}"

  deploy:
    name: roll the demo server
    needs: release
    runs-on: ubuntu-latest
    environment: demo
    env:
      HAS_SERVER: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_SERVER == 'true'

      - name: no server configured
        if: env.HAS_SERVER != 'true'
        run: echo "::notice::DEPLOY_HOST is not set; image pushed, nothing deployed."

      - name: ship the compose files and roll
        if: env.HAS_SERVER == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh_() { ssh -i ~/.ssh/id_deploy "$USER@$HOST" "$@"; }

          # The server's .env (domain, password) is never touched; only the
          # compose definition and the Caddyfile come from the repo.
          scp -i ~/.ssh/id_deploy deploy/prod/docker-compose.yml deploy/prod/Caddyfile "$USER@$HOST:ithaca/"

          # Pin the exact version, pull it, then roll. `up -d` recreates only
          # containers whose image or config changed; migrations run first.
          ssh_ "cd ithaca && sed -i 's/^ITHACA_VERSION=.*/ITHACA_VERSION=$VERSION/' .env \
                && docker compose pull --quiet && docker compose up -d --remove-orphans"

          # Wait for it to be healthy, or fail the job loudly.
          # Count the healthy services rather than look for unhealthy ones, so
          # an empty or failed `ps` can never read as success.
          for _ in $(seq 1 30); do
            n=$(ssh_ "cd ithaca && docker compose ps --format '{{.Service}} {{.Health}}'" \
                 | grep -cE '^(api|ws|dispatcher|worker|receiver-sim) healthy$' || true)
            if [ "$n" = 5 ]; then echo "all 5 services healthy on $VERSION"; exit 0; fi
            sleep 5
          done
          ssh_ "cd ithaca && docker compose ps && docker compose logs --tail 50"
          exit 1
