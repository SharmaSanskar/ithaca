# Fast, local, and only the checks worth blocking a commit for.
#
#   pip install pre-commit && pre-commit install
#
# Deliberately NOT here: golangci-lint and the test suite. A hook that takes
# 40 seconds gets bypassed with --no-verify within a week, and a hook everyone
# bypasses is worse than no hook. Those belong in CI.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.golden$'
      - id: end-of-file-fixer
        exclude: '\.golden$'
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Helm templates are not valid YAML until rendered.
        exclude: '^deploy/helm/.*/templates/'
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # Credentials in git history are effectively permanent: rotating the secret
  # is the only real remedy, and you have to notice first. This is the cheapest
  # possible insurance.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w -s
        language: system
        types: [go]
        pass_filenames: true

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        files: '^(go\.mod|go\.sum)$'
        pass_filenames: false

      # State files carry every output in plaintext, including generated
      # passwords, and two people applying from different checkouts silently
      # destroy each other's infrastructure. .gitignore covers this; the hook
      # is the belt to that braces.
      - id: no-terraform-state
        name: block terraform state files
        entry: bash -c 'echo "terraform state must never be committed; it belongs in the S3 backend"; exit 1'
        language: system
        files: '\.tfstate($|\.)'
        pass_filenames: false

      - id: terraform-fmt
        name: terraform fmt
        entry: bash -c 'command -v terraform >/dev/null 2>&1 && terraform fmt -recursive infra/ || true'
        language: system
        files: '\.tf$'
        pass_filenames: false
