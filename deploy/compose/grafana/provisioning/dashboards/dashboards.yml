apiVersion: 1

providers:
  - name: ithaca
    orgId: 1
    type: file
    disableDeletion: false
    # Dashboards are committed as JSON and provisioned from disk rather than
    # edited in the UI. A dashboard that only exists in someone's browser is
    # lost the first time the volume is deleted.
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
