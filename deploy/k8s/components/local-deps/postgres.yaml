apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60 # a clean checkpoint beats crash recovery
      securityContext:
        # The alpine image's postgres user. Running as it from the start (not
        # root, then su) is what lets this pass the restricted profile.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17-alpine
          args:
            - -c
            - shared_buffers=256MB
            - -c
            - max_connections=300 # 20 autoscaled dispatchers × 8, plus everything else
            - -c
            - shared_preload_libraries=pg_stat_statements
            # LOCAL CLUSTERS ONLY. This volume lives inside a k3s node container,
            # on the same Docker disk as k3s's own datastore, and fsync there is
            # slow enough to stretch every per-stream sequence lock (held until
            # commit) into a queue, and to stall the API server too (measured:
            # 19 backends on row locks, 10 on WAL writes, at 800 events/s).
            # This cluster exists to show scheduling and autoscaling; durability
            # is measured in bench/ against Postgres with fsync and synchronous
            # commit ON. A real environment uses managed Postgres and never this.
            - -c
            - synchronous_commit=off
          env:
            - { name: POSTGRES_USER, value: ithaca }
            - { name: POSTGRES_DB, value: ithaca }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ithaca-secrets, key: POSTGRES_PASSWORD } }
            # A subdirectory: the volume's root may hold lost+found, which
            # initdb refuses to share.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          # 5 s timeouts, not the 1 s default: on a busy node pg_isready itself
          # can take over a second, and a liveness probe that times out under
          # load restarts the database exactly when it is needed most.
          readinessProbe:
            exec: { command: [pg_isready, -U, ithaca, -d, ithaca] }
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: [pg_isready, -U, ithaca, -d, ithaca] }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - { name: run, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { ithaca.dev/db-client: "true" } }
      ports:
        - { port: 5432 }
---
# The other half of the same flow: the clients' egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: db-clients-egress }
spec:
  podSelector: { matchLabels: { ithaca.dev/db-client: "true" } }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: postgres } }
      ports:
        - { port: 5432 }
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: redis } }
      ports:
        - { port: 6379 }
