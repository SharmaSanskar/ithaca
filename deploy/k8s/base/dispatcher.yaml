# Leases streams and delivers. The pool Phase 9 autoscales on queue depth.
# No inbound traffic at all, so no drain delay; its whole grace is for
# finishing in-flight deliveries.
# The pod shape (probes, security context, grace period) is explained in api.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: dispatcher }
  template:
    metadata:
      labels: { app.kubernetes.io/name: dispatcher, ithaca.dev/db-client: "true", ithaca.dev/egress: webhooks }
    spec:
      serviceAccountName: ithaca
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: dispatcher }
      initContainers:
        - name: migrate
          image: ithaca
          args: ["migrate", "up"]
          envFrom:
            - configMapRef: { name: ithaca-config }
            - secretRef: { name: ithaca-secrets }
          securityContext: &locked
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      containers:
        - name: dispatcher
          image: ithaca
          args: ["dispatcher"]
          envFrom:
            - configMapRef: { name: ithaca-config }
            - secretRef: { name: ithaca-secrets }
          ports:
            - { name: admin, containerPort: 9083 }
          securityContext: *locked
          startupProbe:
            httpGet: { path: /startupz, port: admin }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcher
spec:
  selector: { app.kubernetes.io/name: dispatcher }
  ports:
    - { name: admin, port: 9083, targetPort: admin }
