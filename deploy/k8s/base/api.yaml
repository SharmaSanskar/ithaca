# The control plane and the embedded dashboard. This file carries the
# commentary for the pod shape all six services share.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    # Surge, never dip: a rollout adds the new pod before removing an old one.
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api, ithaca.dev/db-client: "true" }
    spec:
      serviceAccountName: ithaca
      automountServiceAccountToken: false
      # Must exceed the in-process drain: 5 s drain delay (readiness fails,
      # still serving while endpoints update) + 30 s ITHACA_SHUTDOWN_GRACE.
      # Shorter, and the kubelet SIGKILLs mid-drain. No preStop sleep: the
      # binary runs its own drain delay on SIGTERM (and distroless has no
      # `sleep` to exec anyway).
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        # Two replicas on one node is one replica as far as a node drain is
        # concerned.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: api }
      initContainers:
        # Schema before code, per pod. Migrations are forward-only and take a
        # Postgres advisory lock, so replicas racing here serialize, and every
        # pod after the first sees a no-op.
        - name: migrate
          image: ithaca
          args: ["migrate", "up"]
          envFrom:
            - configMapRef: { name: ithaca-config }
            - secretRef: { name: ithaca-secrets }
          securityContext: &locked
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      containers:
        - name: api
          image: ithaca
          args: ["api"]
          envFrom:
            - configMapRef: { name: ithaca-config }
            - secretRef: { name: ithaca-secrets }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9080 }
          securityContext: *locked
          # Probes, and why they differ:
          #   startup    /startupz  boot finished (pools open, listeners up).
          #                         Until it passes, liveness is not checked.
          #   liveness   /healthz   is the PROCESS wedged? Never touches a
          #                         dependency: a Postgres blip must not get
          #                         every pod restarted at once.
          #   readiness  /readyz    should traffic come here? Checks Postgres
          #                         and Redis; a failing pod leaves the Service
          #                         instead of being killed.
          startupProbe:
            httpGet: { path: /startupz, port: admin }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 5
            failureThreshold: 2
          # Requests for scheduling, a memory limit for safety, and NO CPU
          # limit: CFS throttling adds latency spikes to a service whose job
          # is latency, and an idle core is better lent than wasted.
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app.kubernetes.io/name: api }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: admin, port: 9080, targetPort: admin }
