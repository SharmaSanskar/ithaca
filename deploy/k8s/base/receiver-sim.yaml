# The demo's subscribers: programmable latency, failures, outages.
# The pod shape (probes, security context, grace period) is explained in api.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: receiver-sim
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: receiver-sim }
  template:
    metadata:
      labels: { app.kubernetes.io/name: receiver-sim }
    spec:
      serviceAccountName: ithaca
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: receiver-sim
          image: ithaca
          args: ["receiver-sim"]
          envFrom:
            - configMapRef: { name: ithaca-config }
          ports:
            - { name: http, containerPort: 8090 }
            - { name: admin, containerPort: 9085 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /startupz, port: admin }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            # Holds every in-flight request open for its configured latency:
            # 20 autoscaled dispatchers × 32 workers × 8 concurrent against a
            # 1 s sink is thousands of connections. At 128Mi it was
            # OOM-killed mid-burst (and lost its in-memory sink settings).
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: receiver-sim
spec:
  selector: { app.kubernetes.io/name: receiver-sim }
  ports:
    - { name: http, port: 8090, targetPort: http }
    - { name: admin, port: 9085, targetPort: admin }
