# The live-feed WebSocket hub. Stateful (long-lived sockets), so it deploys
# separately from the API: an API rollout must not drop every dashboard.
# The pod shape (probes, security context, grace period) is explained in api.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: ws }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ws, ithaca.dev/db-client: "true" }
    spec:
      serviceAccountName: ithaca
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: ws }
      initContainers:
        - name: migrate
          image: ithaca
          args: ["migrate", "up"]
          envFrom:
            - configMapRef: { name: ithaca-config }
            - secretRef: { name: ithaca-secrets }
          securityContext: &locked
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      containers:
        - name: ws
          image: ithaca
          args: ["ws"]
          envFrom:
            - configMapRef: { name: ithaca-config }
            - secretRef: { name: ithaca-secrets }
          ports:
            - { name: http, containerPort: 8082 }
            - { name: admin, containerPort: 9082 }
          securityContext: *locked
          startupProbe:
            httpGet: { path: /startupz, port: admin }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ws
spec:
  selector: { app.kubernetes.io/name: ws }
  ports:
    - { name: http, port: 8082, targetPort: http }
    - { name: admin, port: 9082, targetPort: admin }
