# The public write path: accept, record durably, 202. No outbound calls.
# The pod shape (probes, security context, grace period) is explained in api.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: ingest }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ingest, ithaca.dev/db-client: "true" }
    spec:
      serviceAccountName: ithaca
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: ingest }
      initContainers:
        - name: migrate
          image: ithaca
          args: ["migrate", "up"]
          envFrom:
            - configMapRef: { name: ithaca-config }
            - secretRef: { name: ithaca-secrets }
          securityContext: &locked
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      containers:
        - name: ingest
          image: ithaca
          args: ["ingest"]
          envFrom:
            - configMapRef: { name: ithaca-config }
            - secretRef: { name: ithaca-secrets }
          env:
            # Ingest is the write path: every event is a transaction. It gets
            # twice the shared per-pod cap (bench E1: a pool this size sustains
            # ~1,000 events/s per process at p99 < 50 ms on a laptop).
            - { name: ITHACA_DB_MAX_CONNS, value: "16" }
          ports:
            - { name: http, containerPort: 8081 }
            - { name: admin, containerPort: 9081 }
          securityContext: *locked
          startupProbe:
            httpGet: { path: /startupz, port: admin }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ingest
spec:
  selector: { app.kubernetes.io/name: ingest }
  ports:
    - { name: http, port: 8081, targetPort: http }
    - { name: admin, port: 9081, targetPort: admin }
