# Periodic work: the demo engine (leader-elected by advisory lock, so a
# second replica during a rollout is harmless), janitor, DLQ replay ramp.
# The pod shape (probes, security context, grace period) is explained in api.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker, ithaca.dev/db-client: "true" }
    spec:
      serviceAccountName: ithaca
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: migrate
          image: ithaca
          args: ["migrate", "up"]
          envFrom:
            - configMapRef: { name: ithaca-config }
            - secretRef: { name: ithaca-secrets }
          securityContext: &locked
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      containers:
        - name: worker
          image: ithaca
          args: ["worker"]
          envFrom:
            - configMapRef: { name: ithaca-config }
            - secretRef: { name: ithaca-secrets }
          ports:
            - { name: admin, containerPort: 9084 }
          securityContext: *locked
          startupProbe:
            httpGet: { path: /startupz, port: admin }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  selector: { app.kubernetes.io/name: worker }
  ports:
    - { name: admin, port: 9084, targetPort: admin }
